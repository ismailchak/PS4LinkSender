plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ps4lib.linksender'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ps4lib.linksender'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
